plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.nsu.capstone'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.1.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	// 제약 위반을 오류 메시지가 아니라 제약 이름(PSQLException)으로 구분하려고 컴파일에도 쓴다(NSU-37, NSU-146 규칙)
	implementation 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'com.knuddels:jtokkit:1.1.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// Lombok 스타일 검사 테스트가 src/main/java 소스 원문을 읽는다. 컴파일 결과가 같은 소스 변경에도 test가 다시 실행된다.
	inputs.dir('src/main/java')
		.withPathSensitivity(PathSensitivity.RELATIVE)
		.withPropertyName('lombokStyleSources')
}

spotless {
	enforceCheck false
	ratchetFrom 'origin/main'
	java {
		palantirJavaFormat()
	}
}

// 실명 본인확인 Mock 제공자와 시드 진입점은 서버 jar에 들어가면 안 되어 별도 소스 세트에 둔다(ADR identity_verification/01).
// test는 이 출력을 classpath에 더해 같은 Mock을 쓴다. 서버 jar(bootJar)는 main 출력만 담는다.
sourceSets {
	seed {
		java.srcDir 'src/seed/java'
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
	}
	test {
		compileClasspath += sourceSets.seed.output
		runtimeClasspath += sourceSets.seed.output
	}
}

tasks.named('test') {
	// 서버 jar에 seed 클래스가 없는지 빌드 결과를 열어 본다(ServerJarContentsTest).
	dependsOn tasks.named('bootJar')
	systemProperty 'server.jar.path', tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath
	systemProperty 'seed.classes.dir', sourceSets.seed.java.classesDirectory.get().asFile.absolutePath
}
