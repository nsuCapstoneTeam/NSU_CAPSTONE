services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    labels:
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.2
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    command:
      - /bin/sh
      - -ec
      - |
        limit="$$REDIS_MAXMEMORY"
        number="$${limit%%[!0-9]*}"
        unit="$${limit#$$number}"
        case "$$number" in
          *[1-9]*) ;;
          *) echo "REDIS_MAXMEMORY must be positive" >&2; exit 1 ;;
        esac
        case "$$unit" in
          ''|b|kb|mb|gb) ;;
          *) echo "REDIS_MAXMEMORY unit must be b, kb, mb or gb" >&2; exit 1 ;;
        esac
        exec docker-entrypoint.sh redis-server --maxmemory "$$limit" --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
