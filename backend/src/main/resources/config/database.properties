spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:capstone_db}
spring.datasource.username=${POSTGRES_USER:capstone}
# 제약 위반 메시지에 PostgreSQL Detail(충돌한 이메일 등 행 값)이 붙지 않게 한다. 제약 이름은 본 메시지에 남는다.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
