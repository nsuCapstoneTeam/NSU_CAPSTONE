# 폼 본문(application/x-www-form-urlencoded)은 Tomcat이 앱의 래퍼를 거치지 않고 파라미터로 파싱한다.
# 값은 RequestBodyLimitFilter.MAX_BODY_BYTES와 같아야 한다(RequestBodyLimitTomcatIntegrationTest가 고정, ADR request_body_limit/00 Decision 8).
# 환경 변수 등으로 다른 값이 들어오면 FormPostSizeValidation이 기동을 막는다.
server.tomcat.max-http-form-post-size=64KB
