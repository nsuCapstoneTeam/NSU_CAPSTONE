# 배포 로그는 한 줄에 JSON 하나(logstash)다. 설정이 없어도 JSON이라 배포에서 변수를 빠뜨려도 깨지지 않는다.
# 로컬에서 평문을 보려면 LOG_LOCAL_MODE=true와 LOG_FORMAT=(빈 값)을 함께 둔다(ADR logging/00 Decision 4).
logging.structured.format.console=${LOG_FORMAT:logstash}

# 예외는 클래스 이름과 스택 프레임만 남기고 메시지는 뺀다(요청 입력이 메시지에 섞이기 쉽다, ADR logging/00 Decision 7-4).
# 한 줄이 Docker json-file 드라이버의 줄 분할(16 KiB)에 걸리지 않게 스택 트레이스 길이를 제한한다.
logging.structured.json.stacktrace.printer=com.nsu.capstone.global.logging.MessagelessStackTracePrinter
logging.structured.json.stacktrace.max-length=8192
# 길이 제한이 걸려도 가장 깊은 원인 예외가 먼저 남게 한다. 메시지가 없는 로그에서 원인 클래스는 장애 때 단서의 전부다.
logging.structured.json.stacktrace.root=first
