# 배포 로그는 한 줄에 JSON 하나(logstash)다. 설정이 없어도 JSON이라 배포에서 변수를 빠뜨려도 깨지지 않는다.
# 로컬에서 평문을 보려면 LOG_LOCAL_MODE=true와 LOG_FORMAT=(빈 값)을 함께 둔다(ADR logging/00 Decision 4).
logging.structured.format.console=${LOG_FORMAT:logstash}

# 로컬 평문 출력은 줄마다 요청 ID를 붙인다. JSON 출력은 MDC를 requestId 필드로 자동으로 싣는다.
# 값 끝에 공백을 두지 않는다. 편집기와 포맷터가 지우기 쉽고, Boot가 뒤에 공백 한 칸을 붙인다(LocalModeTest가 고정).
logging.pattern.correlation=[%X{requestId:-}]

# 로그 보호 장치(레벨 하한, JVM 디버그 옵션 검사, 출력 장치 검사)를 끄는 길은 이 로컬 모드 하나뿐이다. 배포에서 쓰지 않는다.
nsu.logging.local-mode=${LOG_LOCAL_MODE:false}

# 예외는 클래스 이름과 스택 프레임만 남기고 메시지는 뺀다(요청 입력이 메시지에 섞이기 쉽다, ADR logging/00 Decision 7-4).
logging.structured.json.stacktrace.printer=com.nsu.capstone.global.logging.MessagelessStackTracePrinter
# 한 줄이 Docker json-file 드라이버의 줄 분할(16 KiB)에 걸리지 않게 스택 트레이스 길이를 제한한다.
logging.structured.json.stacktrace.max-length=8192
# 길이 제한이 걸려도 가장 깊은 원인 예외가 먼저 남게 한다. 메시지가 없는 로그에서 원인 클래스는 장애 때 단서의 전부다.
logging.structured.json.stacktrace.root=first

# INFO에서도 원문(잘못된 쿠키, 잘못된 요청 주소와 쿼리)을 찍는 Tomcat 로거는 WARN으로 고정한다.
# 환경 변수나 자식 로거 설정이 덮어써도 LogSafetyListener의 레벨 하한이 다시 WARN으로 올린다(ADR logging/00 Decision 7-2·7-3).
logging.level.org.apache.tomcat.util.http=WARN
logging.level.org.apache.coyote.http11.Http11Processor=WARN

# Hibernate는 SQL 오류의 PostgreSQL 본 메시지를 예외를 넘기지 않는 WARN 문장으로 직접 찍는다. 값이 든 본 메시지는
# 메시지 없는 출력기를 거치지 않는다(`invalid input syntax for type uuid: "<값>"`). pgjdbc logServerErrorDetail=false는 DETAIL 줄만 뺀다.
# 예외 자체는 GlobalExceptionHandler가 메시지 없는 스택 트레이스로 남기므로, 이 로거를 꺼도 진단 정보는 남는다.
# OFF는 INFO 하한보다 높아 LogSafetyListener가 올리지 않는다.
logging.level.org.hibernate.orm.jdbc.error=OFF

# DevTools가 켜는 거절 값 WARN(이메일, 전화번호, 인증번호)을 끈다.
spring.mvc.log-resolved-exception=false

# DevTools가 켜지는 실행(bootRun, IDE)은 Boot /error 응답 본문에 예외 메시지와 스택 트레이스를 싣는 기본값을 가장 낮은 우선순위로 넣는다.
# 메시지에는 요청 값이 섞일 수 있어, 명시한 값으로 그 기본값을 이긴다. 켜진 DevTools에서도 Boot의 기본값(never)과 같다.
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# multipart는 지금 파싱하지 않는다. Boot는 컨트롤러를 고르기 전에 파싱하고, 파일 이름 원문이 예외 원인에 남기 때문이다.
# 업로드를 만드는 NSU-89가 다시 켜면서 입력 오류(400)와 저장소 장애(500)를 나눈다(ADR logging/00 Decision 7-6).
spring.servlet.multipart.enabled=false
