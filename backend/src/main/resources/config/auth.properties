auth.signup-session.ttl=30m
auth.signup-verification.otp-ttl=5m
auth.signup-verification.resend-cooldown=60s
auth.signup-verification.max-attempts=5
auth.signup-verification.otp-length=6
auth.signup-verification.hmac-secret=${SIGNUP_VERIFICATION_HMAC_SECRET}
auth.signup-verification.required-terms=${SIGNUP_REQUIRED_TERMS}

auth.jwt.access-token.secret=${JWT_ACCESS_TOKEN_SECRET:}
auth.jwt.access-token.ttl=${JWT_ACCESS_TOKEN_TTL:PT30M}

auth.oauth.enabled=${OAUTH_ENABLED:false}
auth.oauth.authorization-request-ttl=PT5M
auth.oauth.signup-session-ttl=PT30M
auth.oauth.result-ttl=PT1M
auth.oauth.frontend-redirect-uri=${OAUTH_FRONTEND_REDIRECT_URI:}

auth.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
auth.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
auth.oauth.google.issuer-uri=https://accounts.google.com
auth.oauth.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
auth.oauth.google.token-uri=https://oauth2.googleapis.com/token
auth.oauth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
auth.oauth.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
auth.oauth.google.client-authentication-method=client_secret_basic

auth.oauth.kakao.enabled=${KAKAO_OAUTH_ENABLED:false}
auth.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
auth.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
auth.oauth.kakao.issuer-uri=${KAKAO_ISSUER_URI:}
auth.oauth.kakao.authorization-uri=${KAKAO_AUTHORIZATION_URI:}
auth.oauth.kakao.token-uri=${KAKAO_TOKEN_URI:}
auth.oauth.kakao.jwk-set-uri=${KAKAO_JWK_SET_URI:}
auth.oauth.kakao.user-info-uri=${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v1/oidc/userinfo}
auth.oauth.kakao.client-authentication-method=${KAKAO_CLIENT_AUTHENTICATION_METHOD:}

auth.oauth.naver.enabled=${NAVER_OAUTH_ENABLED:false}
auth.oauth.naver.client-id=${NAVER_CLIENT_ID:}
auth.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
auth.oauth.naver.issuer-uri=${NAVER_ISSUER_URI:}
auth.oauth.naver.authorization-uri=${NAVER_AUTHORIZATION_URI:}
auth.oauth.naver.token-uri=${NAVER_TOKEN_URI:}
auth.oauth.naver.jwk-set-uri=${NAVER_JWK_SET_URI:}
auth.oauth.naver.user-info-uri=${NAVER_USER_INFO_URI:}
auth.oauth.naver.client-authentication-method=${NAVER_CLIENT_AUTHENTICATION_METHOD:}

auth.verification.sms.solapi.enabled=${SOLAPI_ENABLED:false}
auth.verification.sms.solapi.api-key=${SOLAPI_API_KEY:}
auth.verification.sms.solapi.api-secret=${SOLAPI_API_SECRET:}
auth.verification.sms.solapi.from-number=${SOLAPI_FROM_NUMBER:}

auth.verification.email.resend.enabled=${RESEND_ENABLED:false}
auth.verification.email.resend.api-key=${RESEND_API_KEY:}
auth.verification.email.resend.from-email=${RESEND_FROM_EMAIL:}
