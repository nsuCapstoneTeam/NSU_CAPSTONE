# 실명 본인확인 설정(ADR identity_verification/01). 비밀 값과 채널 값에는 기본값이 없다.
# 환경 변수가 없으면 자리표시자가 문자열로 묶이므로, 앱이 그런 값을 시작할 때 거절한다.
identity-verification.provider=${IDENTITY_VERIFICATION_PROVIDER}
identity-verification.name-encryption-key=${IDENTITY_NAME_ENCRYPTION_KEY}
identity-verification.portone.api-secret=${PORTONE_API_SECRET}
identity-verification.portone.store-id=${PORTONE_STORE_ID}
identity-verification.portone.channel-key=${PORTONE_CHANNEL_KEY}
identity-verification.portone.test-channel.pg-provider=${PORTONE_TEST_CHANNEL_PG_PROVIDER}
identity-verification.portone.test-channel.pg-merchant-id=${PORTONE_TEST_CHANNEL_PG_MERCHANT_ID}
