# 외부 음악 플랫폼 계정 연결 설정. 비밀값은 환경 변수로만 넣고 기본값을 두지 않는다(ADR external_links/00).
# 모듈 설정 클래스(ExternalAccountConfig)의 @PropertySource로 읽는다.
external-account.frontend-base-uri=${EXTERNAL_ACCOUNT_FRONTEND_BASE_URI:}
# false only for local HTTP development (cookie name NSU_EXTACCT_BINDING_DEV, no Secure).
external-account.binding-cookie-secure=${EXTERNAL_ACCOUNT_BINDING_COOKIE_SECURE:true}

# Spotify는 개발 모드 앱 소유자의 Premium 승인 전까지 꺼 둔다(ADR 4번).
external-account.spotify.enabled=${EXTERNAL_ACCOUNT_SPOTIFY_ENABLED:false}
external-account.spotify.client-id=${EXTERNAL_ACCOUNT_SPOTIFY_CLIENT_ID:}
external-account.spotify.client-secret=${EXTERNAL_ACCOUNT_SPOTIFY_CLIENT_SECRET:}

# YouTube OAuth 클라이언트는 로그인용 Google 프로젝트와 다른 프로젝트에 둔다(ADR 14번).
external-account.youtube.enabled=${EXTERNAL_ACCOUNT_YOUTUBE_ENABLED:false}
external-account.youtube.client-id=${EXTERNAL_ACCOUNT_YOUTUBE_CLIENT_ID:}
external-account.youtube.client-secret=${EXTERNAL_ACCOUNT_YOUTUBE_CLIENT_SECRET:}
external-account.youtube.api-key=${EXTERNAL_ACCOUNT_YOUTUBE_API_KEY:}
external-account.youtube.redirect-uri=${EXTERNAL_ACCOUNT_YOUTUBE_REDIRECT_URI:}
