name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Spotless 검사
        working-directory: backend
        run: ./gradlew spotlessCheck
      - name: 코드 스타일 검사(Lombok 스타일, 로그 안전 규칙)
        working-directory: backend
        run: ./gradlew test --tests 'com.nsu.capstone.global.codestyle.*'

  # 로그에 개인정보가 새지 않고 요청 ID가 붙는지 PR마다 확인한다(ADR logging/00 Decision 9).
  # 실제 Tomcat과 Testcontainers(PostgreSQL, Redis)를 쓰므로 Docker가 있는 ubuntu-latest에서 돈다.
  backend-log-safety:
    runs-on: ubuntu-latest
    # 별도 JVM 테스트가 끝나지 않는 자식을 만나도 기본 제한(6시간)까지 붙잡히지 않게 한다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: 로그 안전 테스트
        working-directory: backend
        # shortcut: global.logging 테스트만 돌린다. NSU-135가 전체 테스트를 CI에 올리면 그 job에 합친다.
        run: ./gradlew test --tests 'com.nsu.capstone.global.logging.*'

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci --ignore-scripts
      - name: ESLint 검사
        run: npm run lint -- --max-warnings=0
